[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-self-healing-forecaster"
version = "0.1.0"
description = "End-to-end automated retraining and drift-monitoring ML system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.5.2",
    "lightgbm>=4.5.0",
    "mlflow>=2.17.0",
    "evidently>=0.4.40",
    "prefect>=3.1.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.3",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

